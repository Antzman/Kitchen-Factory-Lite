{% extends 'base.html' %}
{% block title %}Change Temporary Password - Kitchen Factory{% endblock %}
{% block content %}
<section class="card">
    <h1>Choose a New Password</h1>
    <p>Your administrator issued a temporary password. Set a new password to continue using Kitchen Factory.</p>
    <form method="post" class="grid-form">
        <label>New Password<input type="password" name="password" minlength="12" autocomplete="new-password" required autofocus></label>
        <label>Confirm New Password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label>
        <button class="primary-btn" type="submit">Update Password</button>
    </form>
</section>
{% endblock %}
