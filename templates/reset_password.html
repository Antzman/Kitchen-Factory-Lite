{% extends 'base.html' %}
{% block title %}Reset Password - Kitchen Factory{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<div class="login-layout"><section class="login-card">
    <div class="login-card-heading"><span class="login-eyebrow">Kitchen Factory</span><h1>Reset Password</h1><p>Choose a new password for your account.</p></div>
    <form method="post" class="login-form">
        <label>New Password<input type="password" name="password" autocomplete="new-password" minlength="12" required autofocus></label>
        <label>Confirm New Password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label>
        <button type="submit" class="primary-btn">Update Password</button>
    </form>
    <p class="login-help"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</section></div>
{% endblock %}
