{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Edit Stock Item</h2>
    <form method="post" class="grid-form">
        <label>Code<input type="text" name="code" value="{{ item['code'] }}" required></label>
        <label>Name<input type="text" name="name" value="{{ item['name'] }}" required></label>
        <label>Stock Item Type<select name="item_type" required>
            <option value="raw_material" {% if item['item_type'] == 'raw_material' %}selected{% endif %}>Raw Material</option>
            <option value="manufactured_item" {% if item['item_type'] == 'manufactured_item' %}selected{% endif %}>Manufactured Item</option>
            <option value="portioned_item" {% if item['item_type'] == 'portioned_item' %}selected{% endif %}>Portioned Item</option>
        </select></label>
        <label>Unit<select name="unit"><option value="kg" {% if item['unit']=='kg' %}selected{% endif %}>kg</option><option value="L" {% if item['unit']=='L' %}selected{% endif %}>L</option><option value="each" {% if item['unit']=='each' %}selected{% endif %}>each</option></select></label>
        <label>Quantity<input type="number" step="0.001" name="quantity" value="{{ item['quantity'] }}"></label>
        <label>Cost per Unit<input id="unit-cost" type="number" step="0.01" min="0" name="unit_cost" value="{{ item['unit_cost'] }}"></label>
        <label>Total Cost<input id="total-cost" type="text" value="0.00" readonly></label>
        <label>Category<select name="category_id">{% for category in categories %}<option value="{{ category['id'] }}" {% if category['id'] == item['category_id'] %}selected{% endif %}>{{ category['name'] }}</option>{% endfor %}</select></label>
        <label><input type="checkbox" name="active" {% if item['active'] %}checked{% endif %}> Active</label>
        <label class="full-width">Notes<textarea name="notes" placeholder="Add notes about this stock item">{{ item['notes'] or '' }}</textarea></label>
        <button type="submit" class="primary-btn">Update</button>
    </form>
</div>
<script>
    (function () {
        var quantity = document.querySelector('input[name="quantity"]');
        var unitCost = document.getElementById('unit-cost');
        var totalCost = document.getElementById('total-cost');
        function updateTotalCost() {
            var total = (Number(quantity.value) || 0) * (Number(unitCost.value) || 0);
            totalCost.value = total.toFixed(2);
        }
        quantity.addEventListener('input', updateTotalCost);
        unitCost.addEventListener('input', updateTotalCost);
        updateTotalCost();
    }());
</script>
{% endblock %}
